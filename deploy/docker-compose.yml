# zufc (UFC ZAQ) on the shared server, in /opt/zufc. Only the app runs here:
# HTTPS for the domain comes from the server's existing Caddy container, which
# reaches this app as zufc-app:3000 over the shared Docker network "edge"
# (deploy/server-setup.sh creates it and adds the site to that Caddy).
# Everything on "edge" is visible by its service name to every other project
# there, so the service has a unique name: a plain "app" would hijack the other
# stacks' "reverse_proxy app:..." routes.
# GitHub Actions copies this file here, writes app_password (the shared login
# password) and runs remote-deploy.sh, which writes .env: APP_IMAGE and the
# optional APP_NAME, TIMEZONE, PLAYERS, SESSION_DAYS.
name: zufc

services:
  zufc-app:
    image: ${APP_IMAGE:?APP_IMAGE is not set - deploy with remote-deploy.sh}
    init: true
    restart: unless-stopped
    environment:
      APP_PASSWORD_FILE: /run/secrets/app_password
      TRUST_PROXY: '1'
      # Empty values mean "use the app's default"
      APP_NAME: ${APP_NAME:-}
      TIMEZONE: ${TIMEZONE:-}
      PLAYERS: ${PLAYERS:-}
      SESSION_DAYS: ${SESSION_DAYS:-}
    secrets:
      - app_password
    volumes:
      - app-data:/app/data
    # No published ports. Only containers on "edge" (the server's Caddy) reach it,
    # and it can't see other projects' private networks (their databases).
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  edge:
    external: true

secrets:
  app_password:
    file: ./app_password

volumes:
  app-data: # the scoreboard database and its backups
