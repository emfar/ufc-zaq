<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <title>%APP_NAME%</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="modulepreload" href="/js/api.js" />
    <link rel="modulepreload" href="/js/dom.js" />
    <link rel="modulepreload" href="/js/format.js" />
    <link rel="modulepreload" href="/js/ui.js" />
    <link rel="modulepreload" href="/js/views/board.js" />
    <link rel="modulepreload" href="/js/views/register.js" />
    <link rel="modulepreload" href="/js/views/history.js" />
    <link rel="modulepreload" href="/js/views/rules.js" />
    <link rel="modulepreload" href="/js/views/login.js" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="boot" aria-label="Loading"><span class="boot-ring"></span></div>
    </div>
    <noscript><p class="noscript">%APP_NAME% needs JavaScript turned on.</p></noscript>
  </body>
</html>
